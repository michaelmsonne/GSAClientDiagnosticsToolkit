name: Publish to PowerShell Gallery

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate and stage only, do NOT publish)'
        type: boolean
        default: true
      run_tests:
        description: 'Run the Pester test suite before publishing'
        type: boolean
        default: false
      prerelease:
        description: 'Prerelease label (e.g. beta1). Leave empty for a stable release.'
        type: string
        required: false
        default: ''
      release_notes:
        description: 'Optional release notes override. If empty, the matching CHANGELOG.md section is used (falling back to [Unreleased], then GitHub auto-generated notes)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  MODULE_NAME: GSAClientDiagnosticsToolkit

jobs:
  publish:
    name: Validate and publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Pester tests
        if: ${{ inputs.run_tests }}
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

      - name: Stage module
        shell: pwsh
        run: |
          # Publish-Module requires the folder name to match the module name
          $stage = Join-Path $env:RUNNER_TEMP $env:MODULE_NAME
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path ./src/* -Destination $stage -Recurse -Force
          "STAGE_PATH=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Resolve release notes
        shell: pwsh
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = $null
          $source = $null

          if ($env:RELEASE_NOTES) {
            $notes = $env:RELEASE_NOTES
            $source = "workflow input 'release_notes'"
          }
          elseif (Test-Path ./CHANGELOG.md) {
            $baseVersion = (Import-PowerShellDataFile -Path ./src/$($env:MODULE_NAME).psd1).ModuleVersion
            $candidates = @()
            if ($env:PRERELEASE) { $candidates += "$baseVersion-$($env:PRERELEASE)" }
            $candidates += $baseVersion
            $candidates += 'Unreleased'

            # Level-2 headings look like: ## [1.0.0] - 2026-10-16  (level-3 '### Added' headings are part of the section)
            $lines = Get-Content -Path ./CHANGELOG.md -Encoding UTF8
            foreach ($candidate in $candidates) {
              $start = -1
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s+\[?([^\]\s]+)\]?(\s|$)' -and $Matches[1] -ieq $candidate) { $start = $i + 1; break }
              }
              if ($start -lt 0) { continue }
              $end = $lines.Count
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s') { $end = $i; break }
              }
              $section = ($lines[$start..($end - 1)] -join "`n").Trim()
              if ($section) {
                $notes = $section
                $source = "CHANGELOG.md section [$candidate]"
                break
              }
            }
          }

          if ($notes) {
            [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding($false)))
            "RELEASE_NOTES_FILE=$notesFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Release notes source: $source ($($notes.Length) characters)"
            Write-Host "::group::Release notes ($source)"
            # Disable workflow-command processing while echoing user-controlled text
            $stopToken = [guid]::NewGuid().ToString('N')
            Write-Host "::stop-commands::$stopToken"
            Write-Host $notes
            Write-Host "::$stopToken::"
            Write-Host "::endgroup::"
            "### Release notes ($source)`n`n$notes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          else {
            Write-Warning "No release notes found (no input and no matching CHANGELOG.md section). GitHub will auto-generate notes; the Gallery ReleaseNotes will keep the manifest value."
          }

      - name: Apply prerelease label / release notes
        shell: pwsh
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $manifest = Join-Path $env:STAGE_PATH "$($env:MODULE_NAME).psd1"
          $declared = (Import-PowerShellDataFile -Path $manifest).ModuleVersion
          if ($declared -notmatch '^\d+(\.\d+){1,3}$') {
            throw "ModuleVersion '$declared' in the manifest is invalid. Use a plain version like 1.0.0 and pass the label (e.g. beta1) via the 'prerelease' workflow input."
          }
          if ($env:PRERELEASE) {
            Update-ModuleManifest -Path $manifest -Prerelease $env:PRERELEASE
          }
          if ($env:RELEASE_NOTES_FILE) {
            Update-ModuleManifest -Path $manifest -ReleaseNotes (Get-Content -Path $env:RELEASE_NOTES_FILE -Raw -Encoding UTF8)
          }

      - name: Validate manifest and import
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:STAGE_PATH "$($env:MODULE_NAME).psd1"
          $manifest = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
          Write-Host "Module : $($manifest.Name)"
          Write-Host "Version: $($manifest.Version)"
          Import-Module $manifestPath -Force -ErrorAction Stop

          $exported = @((Get-Command -Module $env:MODULE_NAME).Name)
          $missing = $manifest.ExportedFunctions.Keys | Where-Object { $_ -notin $exported }
          if ($missing) { throw "Manifest exports functions that do not exist: $($missing -join ', ')" }

          "MODULE_VERSION=$($manifest.Version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Ensure version is not already published
        shell: pwsh
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:MODULE_VERSION
          $findParams = @{
            Name            = $env:MODULE_NAME
            Repository      = 'PSGallery'
            ErrorAction     = 'SilentlyContinue'
          }
          if ($env:PRERELEASE) {
            $version = "$version-$($env:PRERELEASE)"
            $findParams.AllowPrerelease = $true
          }
          $findParams.RequiredVersion = $version
          if (Find-Module @findParams) {
            throw "Version $version of $($env:MODULE_NAME) already exists on PowerShell Gallery. Bump ModuleVersion in src/$($env:MODULE_NAME).psd1."
          }
          Write-Host "Version $version is not yet published."

          # Fail before publishing if the GitHub release/tag already exists
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub release '$tag' already exists." }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Git tag '$tag' already exists." }
          $global:LASTEXITCODE = 0

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          Write-Host "Dry run enabled - validating publish with -WhatIf (nothing will be published)."
          Publish-Module -Path $env:STAGE_PATH -NuGetApiKey 'dry-run' -Repository PSGallery -WhatIf -Verbose

      - name: Publish to PowerShell Gallery
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) { throw "Secret PSGALLERY_API_KEY is not set." }
          Publish-Module -Path $env:STAGE_PATH -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery -Verbose
          Write-Host "Published $($env:MODULE_NAME) $($env:RELEASE_VERSION) - https://www.powershellgallery.com/packages/$($env:MODULE_NAME)"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "$($env:MODULE_NAME)-$($env:RELEASE_VERSION).zip"
          Compress-Archive -Path $env:STAGE_PATH -DestinationPath $zip -Force

          $ghArgs = @(
            'release', 'create', $env:RELEASE_TAG, $zip,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "$($env:MODULE_NAME) $($env:RELEASE_VERSION)"
          )
          if ($env:PRERELEASE) { $ghArgs += '--prerelease' }
          if ($env:RELEASE_NOTES_FILE) { $ghArgs += @('--notes-file', $env:RELEASE_NOTES_FILE) } else { $ghArgs += '--generate-notes' }

          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub release $($env:RELEASE_TAG)." }

          $releaseUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/$($env:RELEASE_TAG)"
          Write-Host "Created GitHub release: $releaseUrl"
          "### Published`n`n- PowerShell Gallery: https://www.powershellgallery.com/packages/$($env:MODULE_NAME)/$($env:RELEASE_VERSION)`n- GitHub release: $releaseUrl" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Show planned GitHub release (dry run)
        if: ${{ inputs.dry_run }}
        shell: pwsh
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          Write-Host "Dry run - would create GitHub release '$($env:RELEASE_TAG)' (prerelease: $([bool]$env:PRERELEASE)) with $($env:MODULE_NAME)-$($env:RELEASE_VERSION).zip attached."
